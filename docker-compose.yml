services:
  churn-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MODEL_VERSION=logreg-v1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
